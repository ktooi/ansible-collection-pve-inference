---
ct_instance_vmid: 121
ct_instance_hostname: ct-image
ct_instance_unprivileged: false
ct_instance_netif:
  net0: name=eth0,bridge=vmbr0,ip=192.0.2.121/24,gw=192.0.2.1
ct_instance_enable_nvidia_passthrough: true
ct_instance_nvidia_gpus: all
ct_instance_nvidia_bind_driver_libraries: true
ct_instance_nvidia_bind_nvidia_smi: true
ct_instance_host_nvidia_smi_path: /usr/bin/nvidia-smi
ct_instance_nvidia_mount_host_cuda_toolkit: true
ct_instance_host_cuda_toolkit_path: /usr/local/cuda
ct_instance_nvidia_mount_host_cuda_toolkit_into_nvidia_prefix: false
