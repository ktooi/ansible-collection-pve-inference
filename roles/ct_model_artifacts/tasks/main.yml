---
- name: Validate model artifact permission settings
  ansible.builtin.assert:
    that:
      - ct_model_artifacts_manage_permissions is boolean
      - ct_model_artifacts_become_user is string
      - ct_model_artifacts_become_user == '' or ct_model_artifacts_become_user is match('^[a-zA-Z_][a-zA-Z0-9_.-]*[$]?\Z')
    fail_msg: Artifact manage_permissions must be a YAML boolean; become_user must be empty or an existing Linux account name.

- name: Validate model artifact declarations
  ansible.builtin.set_fact:
    ct_model_artifacts_validated: "{{ ct_model_artifacts | ktooi.pve_inference.model_artifacts_validate }}"
    cacheable: false
  no_log: "{{ ct_model_artifacts_no_log }}"

- name: Manage model artifacts in the caller's privilege context
  ansible.builtin.include_tasks: files.yml
  when: ct_model_artifacts_become_user | length == 0

- name: Manage model artifacts as the shared-storage writer
  ansible.builtin.include_tasks:
    file: files.yml
    apply:
      become: true
      become_user: "{{ ct_model_artifacts_become_user }}"
  when: ct_model_artifacts_become_user | length > 0
