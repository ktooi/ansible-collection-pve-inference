---
host_nvidia_gpu_prereq_packages:
  - build-essential
  - dkms
  - mokutil

host_nvidia_gpu_header_packages:
  - "pve-headers-{{ ansible_kernel }}"

host_nvidia_gpu_packages:
  - nvidia-driver
  - nvidia-kernel-dkms
  - nvidia-smi
  - nvidia-persistenced
  - nvidia-modprobe

host_nvidia_gpu_apt_default_release: ""
host_nvidia_gpu_require_apt_default_release: false
host_nvidia_gpu_auto_select_open_kernel_module: true
host_nvidia_gpu_prefer_open_kernel_module: false
host_nvidia_gpu_min_driver_major_for_kernel_6_12_plus: 550
host_nvidia_gpu_min_installed_driver_major: 0

host_nvidia_gpu_modules_standard:
  - nvidia
  - nvidia_uvm
  - nvidia_modeset
  - nvidia_drm

host_nvidia_gpu_modules_current:
  - nvidia-current
  - nvidia-current-uvm
  - nvidia-current-modeset
  - nvidia-current-drm

host_nvidia_gpu_enable_persistenced: true
host_nvidia_gpu_fail_on_persistenced_start: true
host_nvidia_gpu_persistenced_user: nvidia-persistenced
host_nvidia_gpu_persistenced_device_groups:
  - video
host_nvidia_gpu_persistenced_run_as_root: true
host_nvidia_gpu_device_node_group: video
host_nvidia_gpu_device_node_mode: "0660"
host_nvidia_gpu_allow_degraded_nvidia_smi_after_install: false
host_nvidia_gpu_ensure_uvm_device_service: true
host_nvidia_gpu_uvm_device_service_name: nvidia-uvm-devices.service
host_nvidia_gpu_uvm_device_service_after:
  - systemd-modules-load.service
host_nvidia_gpu_uvm_device_service_before:
  - pve-guests.service
host_nvidia_gpu_uvm_device_service_wanted_by:
  - multi-user.target
host_nvidia_gpu_uvm_device_wait_timeout: 30
host_nvidia_gpu_power_limit_watts: ""
host_nvidia_gpu_power_limit_service_name: nvidia-power-limit.service
host_nvidia_gpu_power_limit_script_path: /usr/local/sbin/host-apply-nvidia-power-limit.sh
host_nvidia_gpu_require_pve_kernel: true
host_nvidia_gpu_require_nvidia_devices: true
host_nvidia_gpu_block_proxmox_removal: true
host_nvidia_gpu_require_exact_headers: true

# NVIDIA repository source selection
host_nvidia_gpu_repository_source: debian
host_nvidia_gpu_manage_nvidia_cuda_repo: false
host_nvidia_gpu_nvidia_cuda_repo_url: "https://developer.download.nvidia.com/compute/cuda/repos/debian13/x86_64/"
host_nvidia_gpu_nvidia_cuda_repo_keyring_deb_url: "https://developer.download.nvidia.com/compute/cuda/repos/debian13/x86_64/cuda-keyring_1.1-1_all.deb"
host_nvidia_gpu_nvidia_cuda_repo_keyring_path: /usr/share/keyrings/cuda-archive-keyring.gpg
host_nvidia_gpu_nvidia_cuda_repo_list_filename: nvidia-cuda
host_nvidia_gpu_use_cuda_drivers_meta: false
