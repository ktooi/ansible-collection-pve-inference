---
# Purpose: Refresh all existing APT sources before changing CUDA repository configuration.
- name: Prepare APT prerequisites before configuring the NVIDIA repository
  block:
    - name: Install apt prerequisites for external repository management
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
  rescue:
    - name: Report APT bootstrap failure with repository recovery guidance
      ansible.builtin.fail:
        msg: >-
          APT prerequisite installation failed before this role installed the CUDA
          keyring or configured the NVIDIA repository. update_cache refreshes ALL
          enabled APT sources, including third-party repositories such as Zabbix.
          If the original error names a failing repository, repair that source
          and verify that apt-get --error-on=any update succeeds before rerunning
          this role. Other APT failures, such as package-manager locks, need the
          corresponding fix shown in the original error.
          NOSPLIT means the downloaded InRelease could not be parsed as clearsigned
          metadata; check the repository URL, HTTP proxy/authentication responses,
          and distribution suite. PVE 9 uses Debian 13 (trixie); check for stale
          bookworm entries after upgrading from PVE 8. Do not disable signature
          verification or automatically remove unrelated repositories.
          See docs/troubleshooting-apt.md for recovery steps.
          Original APT error: {{ ansible_failed_result.msg | default('No module error message available') }}

# Purpose: Install NVIDIA-provided keyring package used to verify CUDA repository packages.
- name: Install NVIDIA CUDA keyring package
  ansible.builtin.apt:
    deb: "{{ nvidia_cuda_repo_common_keyring_deb_url }}"

# Purpose: Register NVIDIA CUDA apt repository in host/CT apt sources and refresh metadata.
- name: Configure NVIDIA CUDA apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ nvidia_cuda_repo_common_keyring_path }}] {{ nvidia_cuda_repo_common_repo_url }} /"
    filename: "{{ nvidia_cuda_repo_common_list_filename }}"
    state: present
    update_cache: true
