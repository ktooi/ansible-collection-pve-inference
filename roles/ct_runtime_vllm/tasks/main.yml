---
# Purpose: Load OS/distribution specific variables を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Load OS/distribution specific variables
  ansible.builtin.import_tasks: variables.yml

# Purpose: Normalize served model name for vLLM CLI を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Normalize served model name for vLLM CLI
  ansible.builtin.set_fact:
    ct_runtime_vllm_served_model_name_effective: >-
      {{
        (
          ct_runtime_vllm_served_model_name
          if (ct_runtime_vllm_served_model_name is string)
          else
          (
            (
              ct_runtime_vllm_served_model_name
              | select('string')
              | map('trim')
              | reject('equalto', '')
              | list
              | first
            )
            if (ct_runtime_vllm_served_model_name is sequence and ct_runtime_vllm_served_model_name is not string)
            else ''
          )
        )
      }}

# Purpose: Ensure optional CUDA userspace packages are installed を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Ensure optional CUDA userspace packages are installed
  ansible.builtin.package:
    name: "{{ ct_runtime_vllm_cuda_packages }}"
    state: present
  register: ct_runtime_vllm_cuda_pkg_install
  failed_when: false
  when:
    - ct_runtime_vllm_install_cuda_userspace
    - ct_runtime_vllm_cuda_packages | length > 0

# Purpose: Fail if CUDA userspace package install failed and strict mode is enabled を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Fail if CUDA userspace package install failed and strict mode is enabled
  ansible.builtin.assert:
    that:
      - ct_runtime_vllm_cuda_pkg_install is not failed
    fail_msg: >-
      Failed to install CUDA userspace packages: {{ ct_runtime_vllm_cuda_packages }}.
      Set ct_runtime_vllm_cuda_packages explicitly for your distro or disable strict mode.
  when:
    - ct_runtime_vllm_install_cuda_userspace
    - ct_runtime_vllm_cuda_packages | length > 0
    - ct_runtime_vllm_fail_on_cuda_package_install

# Purpose: Warn when CUDA userspace package install failed but strict mode is disabled を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Warn when CUDA userspace package install failed but strict mode is disabled
  ansible.builtin.debug:
    msg: >-
      CUDA userspace package install failed for {{ ct_runtime_vllm_cuda_packages }}.
      Continuing because ct_runtime_vllm_fail_on_cuda_package_install=false. libcuda preflight will still run.
  when:
    - ct_runtime_vllm_install_cuda_userspace
    - ct_runtime_vllm_cuda_packages | length > 0
    - ct_runtime_vllm_cuda_pkg_install is failed
    - not ct_runtime_vllm_fail_on_cuda_package_install

# Purpose: Check NVIDIA device node visibility in CT を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Check NVIDIA device node visibility in CT
  ansible.builtin.find:
    paths: /dev
    patterns: "nvidia*"
    file_type: any
  register: ct_runtime_vllm_dev_nodes

# Purpose: Assert NVIDIA device nodes are visible in CT を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Assert NVIDIA device nodes are visible in CT
  ansible.builtin.assert:
    that:
      - ct_runtime_vllm_dev_nodes.matched | int > 0
    fail_msg: >-
      NVIDIA device nodes are not visible in CT (/dev/nvidia* missing). Configure CT device passthrough first.
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_require_nvidia_device_nodes


# Purpose: Check critical NVIDIA device node types in CT を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Check critical NVIDIA device node types in CT
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /dev/nvidiactl
    - /dev/nvidia-uvm
  register: ct_runtime_vllm_critical_dev_stats
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_require_nvidia_device_nodes

# Purpose: Assert critical NVIDIA nodes are character devices を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Assert critical NVIDIA nodes are character devices
  ansible.builtin.assert:
    that:
      - (ct_runtime_vllm_critical_dev_stats.results | selectattr('stat.exists', 'equalto', true) | list | length) == 2
      - (ct_runtime_vllm_critical_dev_stats.results | selectattr('stat.ischr', 'equalto', true) | list | length) == 2
    fail_msg: >-
      Critical NVIDIA nodes are missing or not character devices in CT.
      Expected char devices: /dev/nvidiactl and /dev/nvidia-uvm.
      If /dev/nvidia-uvm is a regular file (for example mode ----------), ensure host-side NVIDIA UVM device
      is created and passthrough is re-applied (run host GPU preparation role, then ct_create again).
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_require_nvidia_device_nodes

# Purpose: Check libcuda visibility from dynamic linker cache を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Check libcuda visibility from dynamic linker cache
  ansible.builtin.command: ldconfig -p
  register: ct_runtime_vllm_ldconfig
  changed_when: false
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_require_libcuda

# Purpose: Check common libcuda.so.1 file locations in CT を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Check common libcuda.so.1 file locations in CT
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ ct_runtime_vllm_libcuda_candidate_paths }}"
  register: ct_runtime_vllm_libcuda_candidate_stats
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_require_libcuda

# Purpose: Build libcuda availability fact を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Build libcuda availability fact
  ansible.builtin.set_fact:
    ct_runtime_vllm_libcuda_available: >-
      {{
        ('libcuda.so.1' in ct_runtime_vllm_ldconfig.stdout)
        or
        (
          ct_runtime_vllm_libcuda_candidate_stats.results
          | selectattr('stat.exists')
          | list
          | length > 0
        )
      }}
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_require_libcuda

# Purpose: Discover fallback NVIDIA compute package candidate (APT) を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Discover fallback NVIDIA compute package candidate (APT)
  ansible.builtin.shell: |
    set -o pipefail
    apt-cache search '^libnvidia-compute-[0-9]+(-server)?$' \
      | awk '{print $1}' \
      | sort -Vu \
      | tail -n 1
  args:
    executable: /bin/bash
  register: ct_runtime_vllm_libcuda_fallback_pkg
  changed_when: false
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_require_libcuda
    - not ct_runtime_vllm_libcuda_available
    - ansible_pkg_mgr == "apt"
    - ct_runtime_vllm_install_cuda_userspace

# Purpose: Try installing fallback NVIDIA compute package when libcuda is still missing を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Try installing fallback NVIDIA compute package when libcuda is still missing
  ansible.builtin.package:
    name: "{{ ct_runtime_vllm_libcuda_fallback_pkg.stdout }}"
    state: present
  register: ct_runtime_vllm_libcuda_fallback_install
  failed_when: false
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_require_libcuda
    - not ct_runtime_vllm_libcuda_available
    - ansible_pkg_mgr == "apt"
    - ct_runtime_vllm_install_cuda_userspace
    - ct_runtime_vllm_libcuda_fallback_pkg.stdout | length > 0

# Purpose: Re-check libcuda visibility from dynamic linker cache after fallback install を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Re-check libcuda visibility from dynamic linker cache after fallback install
  ansible.builtin.command: ldconfig -p
  register: ct_runtime_vllm_ldconfig
  changed_when: false
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_require_libcuda
    - not ct_runtime_vllm_libcuda_available

# Purpose: Re-check common libcuda.so.1 file locations in CT after fallback install を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Re-check common libcuda.so.1 file locations in CT after fallback install
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ ct_runtime_vllm_libcuda_candidate_paths }}"
  register: ct_runtime_vllm_libcuda_candidate_stats
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_require_libcuda
    - not ct_runtime_vllm_libcuda_available

# Purpose: Rebuild libcuda availability fact after fallback install を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Rebuild libcuda availability fact after fallback install
  ansible.builtin.set_fact:
    ct_runtime_vllm_libcuda_available: >-
      {{
        ('libcuda.so.1' in ct_runtime_vllm_ldconfig.stdout)
        or
        (
          ct_runtime_vllm_libcuda_candidate_stats.results
          | selectattr('stat.exists')
          | list
          | length > 0
        )
      }}
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_require_libcuda
    - not ct_runtime_vllm_libcuda_available

# Purpose: Assert libcuda.so.1 is available in CT を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Assert libcuda.so.1 is available in CT
  ansible.builtin.assert:
    that:
      - ct_runtime_vllm_libcuda_available
    fail_msg: >-
      libcuda.so.1 is not available inside CT (not found in ldconfig cache and not present in any
      candidate paths: {{ ct_runtime_vllm_libcuda_candidate_paths }}).
      Ensure NVIDIA userspace libraries are available in CT (for example via apt package install,
      host bind-mount, and/or running ldconfig after mounting) before starting vLLM.
      Fallback package candidate: {{ ct_runtime_vllm_libcuda_fallback_pkg.stdout | default('n/a') }}.
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_require_libcuda

# Purpose: Build effective torch CUDA probe mode for preflight を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Build effective torch CUDA probe mode for preflight
  ansible.builtin.set_fact:
    ct_runtime_vllm_torch_cuda_probe_mode_effective: >-
      {{
        'count'
        if (
          (ct_runtime_vllm_torch_cuda_probe_mode | default('strict')) == 'strict'
          and ((ct_runtime_vllm_torch_backend | default('') | length > 0) or (ct_runtime_vllm_version | length > 0))
        )
        else (ct_runtime_vllm_torch_cuda_probe_mode | default('strict'))
      }}
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_require_torch_cuda_available

# Purpose: Warn when strict probe is relaxed to count due to torch backend override を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Warn when strict probe is relaxed to count due to torch backend override
  ansible.builtin.debug:
    msg: >-
      ct_runtime_vllm_torch_backend='{{ ct_runtime_vllm_torch_backend }}' is set, so torch preflight mode is
      relaxed from strict to count. This checks device enumeration only. Runtime CUDA initialization is validated
      by vLLM process startup.
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_require_torch_cuda_available
    - (ct_runtime_vllm_torch_cuda_probe_mode | default('strict')) == 'strict'
    - (ct_runtime_vllm_torch_backend | default('') | length > 0) or (ct_runtime_vllm_version | length > 0)

# Purpose: Check whether /usr/local/cuda exists in CT を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Check whether /usr/local/cuda exists in CT
  ansible.builtin.stat:
    path: /usr/local/cuda
  register: ct_runtime_vllm_cuda_home_default_stat
  when: ct_runtime_vllm_device == "cuda"

# Purpose: Probe nvcc path for CUDA_HOME derivation を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Probe nvcc path for CUDA_HOME derivation
  ansible.builtin.command: bash -lc 'command -v nvcc || true'
  register: ct_runtime_vllm_nvcc_path
  changed_when: false
  when: ct_runtime_vllm_device == "cuda"

# Purpose: Install CUDA toolkit packages when nvcc is missing (auto-remediation) を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Install CUDA toolkit packages when nvcc is missing (auto-remediation)
  ansible.builtin.apt:
    name: "{{ ct_runtime_vllm_nvcc_toolkit_packages }}"
    state: present
    update_cache: true
  register: ct_runtime_vllm_nvcc_toolkit_install
  failed_when: false
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_install_cuda_userspace
    - ct_runtime_vllm_auto_install_nvcc_toolkit
    - (ct_runtime_vllm_nvcc_path.stdout | default('') | trim | length) == 0
    - ct_runtime_vllm_nvcc_toolkit_packages | length > 0

# Purpose: Warn when nvcc toolkit auto-remediation failed を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Warn when nvcc toolkit auto-remediation failed
  ansible.builtin.debug:
    msg: >-
      Failed to auto-install nvcc toolkit packages {{ ct_runtime_vllm_nvcc_toolkit_packages }}.
      stdout={{ ct_runtime_vllm_nvcc_toolkit_install.stdout | default('') | trim }}
      stderr={{ ct_runtime_vllm_nvcc_toolkit_install.stderr | default('') | trim }}
      Continuing to re-probe nvcc; set ct_runtime_vllm_require_nvcc=true to fail hard when nvcc is mandatory.
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_install_cuda_userspace
    - ct_runtime_vllm_auto_install_nvcc_toolkit
    - (ct_runtime_vllm_nvcc_path.stdout | default('') | trim | length) == 0
    - ct_runtime_vllm_nvcc_toolkit_packages | length > 0
    - ct_runtime_vllm_nvcc_toolkit_install is failed

# Purpose: Re-probe nvcc path after auto-remediation を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Re-probe nvcc path after auto-remediation
  ansible.builtin.command: bash -lc 'command -v nvcc || true'
  register: ct_runtime_vllm_nvcc_path
  changed_when: false
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_install_cuda_userspace
    - ct_runtime_vllm_auto_install_nvcc_toolkit
    - ct_runtime_vllm_nvcc_toolkit_packages | length > 0

# Purpose: Install nvcc via pip fallback when apt candidates are unavailable を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Install nvcc via pip fallback when apt candidates are unavailable
  ansible.builtin.pip:
    name: "{{ ct_runtime_vllm_nvcc_pip_package }}"
    virtualenv: "{{ ct_runtime_vllm_venv }}"
  register: ct_runtime_vllm_nvcc_pip_install
  failed_when: false
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_auto_install_nvcc_pip_fallback
    - (ct_runtime_vllm_nvcc_path.stdout | default('') | trim | length) == 0

# Purpose: Resolve CUDA_HOME from nvcc pip package fallback を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Resolve CUDA_HOME from nvcc pip package fallback
  ansible.builtin.command:
    argv:
      - "{{ ct_runtime_vllm_venv }}/bin/python"
      - -c
      - |
        import glob
        import site
        from pathlib import Path
        candidates = []
        for base in site.getsitepackages():
            candidates.extend(glob.glob(str(Path(base) / "nvidia" / "**" / "bin" / "nvcc"), recursive=True))
        if candidates:
            nvcc_path = Path(sorted(candidates)[0]).resolve()
            print(str(nvcc_path.parent.parent))
  register: ct_runtime_vllm_nvcc_pip_cuda_home
  changed_when: false
  failed_when: false
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_auto_install_nvcc_pip_fallback
    - (ct_runtime_vllm_nvcc_path.stdout | default('') | trim | length) == 0


# Purpose: Probe nvcc path from venv bin after pip fallback を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Probe nvcc path from venv bin after pip fallback
  ansible.builtin.command: bash -lc 'if [ -x "{{ ct_runtime_vllm_venv }}/bin/nvcc" ]; then realpath "{{ ct_runtime_vllm_venv }}/bin/nvcc"; fi'
  register: ct_runtime_vllm_nvcc_path_venv
  changed_when: false
  failed_when: false
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_auto_install_nvcc_pip_fallback
    - (ct_runtime_vllm_nvcc_path.stdout | default('') | trim | length) == 0

# Purpose: Collect apt policy for configured nvcc toolkit packages when nvcc is still missing を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Collect apt policy for configured nvcc toolkit packages when nvcc is still missing
  ansible.builtin.command: "apt-cache policy {{ item }}"
  loop: "{{ ct_runtime_vllm_nvcc_toolkit_packages }}"
  register: ct_runtime_vllm_nvcc_toolkit_policy
  changed_when: false
  failed_when: false
  when:
    - ct_runtime_vllm_device == "cuda"
    - (ct_runtime_vllm_nvcc_path.stdout | default('') | trim | length) == 0
    - ct_runtime_vllm_nvcc_toolkit_packages | length > 0

# Purpose: Derive effective CUDA_HOME for vLLM runtime を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Derive effective CUDA_HOME for vLLM runtime
  ansible.builtin.set_fact:
    ct_runtime_vllm_cuda_home_effective: >-
      {{
        ct_runtime_vllm_cuda_home
        if (ct_runtime_vllm_cuda_home | default('') | length > 0)
        else (
          '/usr/local/cuda'
          if (ct_runtime_vllm_cuda_home_default_stat.stat.exists | default(false))
          else (
            (ct_runtime_vllm_nvcc_path.stdout | trim | regex_replace('/bin/nvcc$', ''))
            if (ct_runtime_vllm_nvcc_path.stdout | default('') | trim | length > 0)
            else (
              (ct_runtime_vllm_nvcc_path_venv.stdout | trim | regex_replace('/bin/nvcc$', ''))
              if (ct_runtime_vllm_nvcc_path_venv.stdout | default('') | trim | length > 0)
              else (ct_runtime_vllm_nvcc_pip_cuda_home.stdout | default('') | trim)
            )
          )
        )
      }}
  when: ct_runtime_vllm_device == "cuda"

# Purpose: Derive nvcc bin path from effective CUDA_HOME を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Derive nvcc bin path from effective CUDA_HOME
  ansible.builtin.set_fact:
    ct_runtime_vllm_nvcc_bin_path_effective: >-
      {{
        (ct_runtime_vllm_cuda_home_effective ~ '/bin')
        if (ct_runtime_vllm_cuda_home_effective | default('') | length > 0)
        else ''
      }}
  when: ct_runtime_vllm_device == "cuda"

# Purpose: Warn when nvcc/CUDA_HOME is not detected for CUDA runtime を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Warn when nvcc/CUDA_HOME is not detected for CUDA runtime
  ansible.builtin.debug:
    msg: >-
      nvcc was not detected in CT and ct_runtime_vllm_cuda_home could not be derived.
      Some vLLM/Triton builds require nvcc at runtime and may fail with:
      "Could not find nvcc and default cuda_home='/usr/local/cuda' doesn't exist".
      Set ct_runtime_vllm_cuda_home explicitly and/or install CUDA toolkit userspace in CT.
  when:
    - ct_runtime_vllm_device == "cuda"
    - (ct_runtime_vllm_cuda_home_effective | default('') | length) == 0
    - not ct_runtime_vllm_require_nvcc

# Purpose: Assert nvcc/CUDA_HOME is available when strict requirement is enabled を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Assert nvcc/CUDA_HOME is available when strict requirement is enabled
  ansible.builtin.assert:
    that:
      - (ct_runtime_vllm_cuda_home_effective | default('') | length) > 0
    fail_msg: >-
      nvcc/CUDA_HOME is required but not available in CT.
      Set ct_runtime_vllm_cuda_home or install CUDA toolkit so nvcc is available in PATH.
      Toolkit package policy output:
      {{
        ct_runtime_vllm_nvcc_toolkit_policy.results
        | default([])
        | map(attribute='stdout')
        | list
      }}
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_require_nvcc

# Purpose: Install vLLM package を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Install vLLM package
  ansible.builtin.pip:
    name: "{{ ('vllm==' ~ ct_runtime_vllm_version) if ct_runtime_vllm_version | length > 0 else 'vllm' }}"
    virtualenv: "{{ ct_runtime_vllm_venv }}"

# Purpose: Reinstall pinned torch package after vLLM install (optional) を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Reinstall pinned torch package after vLLM install (optional)
  ansible.builtin.pip:
    name: "{{ ct_runtime_vllm_torch_package }}"
    state: forcereinstall
    virtualenv: "{{ ct_runtime_vllm_venv }}"
    extra_args: >-
      {{
        ('--extra-index-url ' ~ ct_runtime_vllm_torch_extra_index_url)
        if (ct_runtime_vllm_torch_extra_index_url | length > 0)
        else omit
      }}
  when: ct_runtime_vllm_torch_package | length > 0

# Purpose: Probe NVIDIA driver runtime with nvidia-smi を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Probe NVIDIA driver runtime with nvidia-smi
  ansible.builtin.command:
    argv:
      - nvidia-smi
      - -L
  register: ct_runtime_vllm_nvidia_smi_probe
  changed_when: false
  failed_when: false
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_require_nvidia_smi

# Purpose: Assert nvidia-smi probe succeeded in CT を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Assert nvidia-smi probe succeeded in CT
  ansible.builtin.assert:
    that:
      - ct_runtime_vllm_nvidia_smi_probe.rc == 0
      - (ct_runtime_vllm_nvidia_smi_probe.stdout | default('') | trim | length) > 0
    fail_msg: >-
      nvidia-smi preflight failed in CT (rc={{ ct_runtime_vllm_nvidia_smi_probe.rc }},
      stderr={{ ct_runtime_vllm_nvidia_smi_probe.stderr | default('') | trim }}).
      NVIDIA driver/runtime may be misconfigured for this container even if /dev/nvidia* and libcuda are present.
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_require_nvidia_smi
    - ct_runtime_vllm_fail_on_nvidia_smi_probe

# Purpose: Warn when nvidia-smi probe failed but strict nvidia-smi mode is disabled を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Warn when nvidia-smi probe failed but strict nvidia-smi mode is disabled
  ansible.builtin.debug:
    msg: >-
      nvidia-smi preflight failed in CT (rc={{ ct_runtime_vllm_nvidia_smi_probe.rc }},
      stderr={{ ct_runtime_vllm_nvidia_smi_probe.stderr | default('') | trim }}).
      Continuing because ct_runtime_vllm_fail_on_nvidia_smi_probe=false.
      torch CUDA preflight will still run and enforce CUDA readiness.
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_require_nvidia_smi
    - not ct_runtime_vllm_fail_on_nvidia_smi_probe
    - ct_runtime_vllm_nvidia_smi_probe.rc != 0

# Purpose: Probe CUDA availability from torch in vLLM venv を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Probe CUDA availability from torch in vLLM venv
  ansible.builtin.command:
    argv:
      - "{{ ct_runtime_vllm_venv }}/bin/python"
      - -c
      - |
        import json
        import torch
        print(json.dumps({"is_available": torch.cuda.is_available(), "device_count": torch.cuda.device_count()}))
  register: ct_runtime_vllm_torch_cuda_probe
  changed_when: false
  failed_when: false
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_require_torch_cuda_available

# Purpose: Build torch CUDA probe fact を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Build torch CUDA probe fact
  ansible.builtin.set_fact:
    ct_runtime_vllm_torch_cuda_info: >-
      {{
        (ct_runtime_vllm_torch_cuda_probe.stdout | default('{}') | trim | from_json)
        if ct_runtime_vllm_torch_cuda_probe.rc == 0
        else {}
      }}
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_require_torch_cuda_available

# Purpose: Probe installed torch package metadata in vLLM venv を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Probe installed torch package metadata in vLLM venv
  ansible.builtin.command:
    argv:
      - "{{ ct_runtime_vllm_venv }}/bin/python"
      - -c
      - |
        import json
        import torch
        print(json.dumps({"torch_version": torch.__version__, "torch_cuda": torch.version.cuda}))
  register: ct_runtime_vllm_torch_version_probe
  changed_when: false
  failed_when: false
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_require_torch_cuda_available

# Purpose: Build torch package metadata fact を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Build torch package metadata fact
  ansible.builtin.set_fact:
    ct_runtime_vllm_torch_version_info: >-
      {{
        (ct_runtime_vllm_torch_version_probe.stdout | default('{}') | trim | from_json)
        if ct_runtime_vllm_torch_version_probe.rc == 0
        else {}
      }}
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_require_torch_cuda_available

# Purpose: Warn when torch backend override does not change installed torch CUDA wheel tag を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Warn when torch backend override does not change installed torch CUDA wheel tag
  ansible.builtin.debug:
    msg: >-
      ct_runtime_vllm_torch_backend='{{ ct_runtime_vllm_torch_backend }}' is a runtime backend selector for vLLM
      and does not reinstall torch wheels. Installed torch in venv is currently
      {{ ct_runtime_vllm_torch_version_info.torch_version | default('unknown') }}
      (cuda={{ ct_runtime_vllm_torch_version_info.torch_cuda | default('unknown') }}).
      If you need a different torch CUDA wheel tag, rebuild/recreate the venv with matching torch/vLLM artifacts.
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_require_torch_cuda_available
    - ct_runtime_vllm_torch_backend | default('') | length > 0
    - ct_runtime_vllm_torch_version_probe.rc == 0

# Purpose: Assert torch can see CUDA devices in vLLM venv を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Assert torch can see CUDA devices in vLLM venv
  ansible.builtin.assert:
    that:
      - ct_runtime_vllm_torch_cuda_probe.rc == 0
      - (ct_runtime_vllm_torch_cuda_info.device_count | default(0) | int) > 0
      - >-
        (
          (ct_runtime_vllm_torch_cuda_probe_mode_effective | default(ct_runtime_vllm_torch_cuda_probe_mode | default('strict'))) == 'count'
        )
        or
        (
          ct_runtime_vllm_torch_cuda_info.is_available | default(false)
        )
    fail_msg: >-
      torch in {{ ct_runtime_vllm_venv }} cannot use CUDA devices (probe={{ ct_runtime_vllm_torch_cuda_info | default({}) }},
      mode={{ ct_runtime_vllm_torch_cuda_probe_mode_effective | default(ct_runtime_vllm_torch_cuda_probe_mode | default('strict')) }}).
      In strict mode, both torch.cuda.device_count()>0 and torch.cuda.is_available()==True are required.
      If you intentionally want count-only validation, set ct_runtime_vllm_torch_cuda_probe_mode='count'.
  when:
    - ct_runtime_vllm_device == "cuda"
    - ct_runtime_vllm_require_torch_cuda_available

# Purpose: Render vLLM environment file を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Render vLLM environment file
  ansible.builtin.template:
    src: vllm.env.j2
    dest: "{{ ct_runtime_vllm_env_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart vllm

# Purpose: Ensure vLLM log files exist when file logging is enabled を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Ensure vLLM log files exist when file logging is enabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: touch
    owner: "{{ ct_runtime_vllm_user }}"
    group: "{{ ct_runtime_vllm_group }}"
    mode: "0644"
  loop:
    - "{{ ct_runtime_vllm_stdout_log }}"
    - "{{ ct_runtime_vllm_stderr_log }}"
  when: ct_runtime_vllm_systemd_log_to_files

# Purpose: Render vLLM systemd service unit を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Render vLLM systemd service unit
  ansible.builtin.template:
    src: vllm.service.j2
    dest: "/etc/systemd/system/{{ ct_runtime_vllm_service_name }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart vllm

# Purpose: Enable and start vLLM service を行い、vLLM ランタイムの前提条件・設定整合性を段階的に満たす。
- name: Enable and start vLLM service
  ansible.builtin.service:
    name: "{{ ct_runtime_vllm_service_name }}"
    enabled: true
    state: started
