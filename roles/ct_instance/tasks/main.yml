---
- name: Normalize Proxmox feature flags for module input
  ansible.builtin.set_fact:
    ct_instance_features_effective: >-
      {{
        (
          ct_instance_features
          | dict2items
          | map(attribute='key')
          | zip(
              ct_instance_features
              | dict2items
              | map(attribute='value')
              | map('string')
            )
          | map('join', '=')
          | list
        )
        if (ct_instance_features is mapping)
        else (ct_instance_features | default([]))
      }}

- name: Normalize Proxmox API token ID for module input
  ansible.builtin.set_fact:
    ct_instance_api_token_id_effective: >-
      {{
        (ct_instance_api_token_id | regex_replace('^' ~ (ct_instance_api_user | regex_escape) ~ '!', ''))
        if (ct_instance_api_token_id is string)
        else ct_instance_api_token_id
      }}

- name: Manage CT lifecycle with fallback for existing VMID
  block:
    - name: Manage CT lifecycle (create or update)
      community.general.proxmox:
        api_host: "{{ ct_instance_api_host }}"
        api_user: "{{ ct_instance_api_user }}"
        api_token_id: "{{ ct_instance_api_token_id_effective }}"
        api_token_secret: "{{ ct_instance_api_token_secret }}"
        validate_certs: "{{ ct_instance_validate_certs }}"
        node: "{{ ct_instance_node }}"
        vmid: "{{ ct_instance_vmid }}"
        hostname: "{{ ct_instance_hostname }}"
        ostemplate: "{{ ct_instance_ostemplate }}"
        password: "{{ (ct_instance_password | default('')) if ((ct_instance_password | default('') | length) > 0) else omit }}"
        pubkey: "{{ (ct_instance_pubkey | default('')) if ((ct_instance_pubkey | default('') | length) > 0) else omit }}"
        storage: "{{ ct_instance_storage }}"
        cores: "{{ ct_instance_cores }}"
        memory: "{{ ct_instance_memory }}"
        swap: "{{ ct_instance_swap }}"
        disk: "{{ ct_instance_storage }}:{{ ct_instance_rootfs_size }}"
        netif: "{{ ct_instance_netif }}"
        features: >-
          {{
            ct_instance_features_effective
            if ((ct_instance_unprivileged | bool) or (ct_instance_api_user == 'root@pam'))
            else omit
          }}
        mounts: "{{ ct_instance_mounts }}"
        unprivileged: "{{ ct_instance_unprivileged }}"
        onboot: "{{ ct_instance_onboot }}"
        timeout: "{{ ct_instance_timeout }}"
        state: "{{ ct_instance_state }}"
      delegate_to: localhost
      register: ct_instance_manage_result

  rescue:
    - name: Detect timeout error from CT create/update task
      when:
        - ct_instance_state == 'present'
        - ct_instance_treat_timeout_as_existing_ct | bool
        - ct_instance_manage_result is defined
      ansible.builtin.set_fact:
        ct_instance_timeout_detected: >-
          {{
            'reached timeout while waiting for creating vm'
            in ((ct_instance_manage_result.msg | default('')) | lower)
          }}

    - name: Check whether CT already exists after timeout
      become: true
      ansible.builtin.command: "pct status {{ ct_instance_vmid }}"
      register: ct_instance_pct_status_after_timeout
      changed_when: false
      failed_when: false
      when:
        - ct_instance_state == 'present'
        - ct_instance_timeout_detected | default(false)

    - name: Mark timeout as acceptable when CT exists
      when:
        - ct_instance_state == 'present'
        - ct_instance_timeout_detected | default(false)
        - ct_instance_pct_status_after_timeout.rc | default(1) == 0
      ansible.builtin.set_fact:
        ct_instance_existing_ct_detected: true

    - name: Mark existing CT as acceptable on rerun
      when:
        - ct_instance_state == 'present'
        - ct_instance_manage_result is defined
        - "'already exists' in ((ct_instance_manage_result.msg | default('')) | lower)"
      ansible.builtin.set_fact:
        ct_instance_existing_ct_detected: true

    - name: Continue when CT already exists (module create path limitation)
      when: ct_instance_existing_ct_detected | default(false)
      ansible.builtin.debug:
        msg: >-
          CT {{ ct_instance_vmid }} already exists. Skipping create-only lifecycle task and continuing
          with post-create configuration steps.

    - name: Fail when CT lifecycle error is not an existing-CT rerun
      when: not (ct_instance_existing_ct_detected | default(false))
      ansible.builtin.fail:
        msg: "{{ ct_instance_manage_result.msg | default('CT lifecycle failed') }}"

# Purpose: Build managed NVIDIA passthrough block from feature flags to avoid manual raw block edits.
- name: Build effective NVIDIA passthrough block
  ansible.builtin.set_fact:
    ct_instance_nvidia_passthrough_block_effective: |-
      lxc.cgroup2.devices.allow: c 195:* rwm
      lxc.cgroup2.devices.allow: c 234:* rwm
      lxc.cgroup2.devices.allow: c 235:* rwm
      lxc.cgroup2.devices.allow: c 503:* rwm
      lxc.cgroup2.devices.allow: c 508:* rwm
      lxc.cgroup2.devices.allow: c 509:* rwm
      lxc.cgroup2.devices.allow: c 510:* rwm
      lxc.cgroup2.devices.allow: c 511:* rwm
      lxc.mount.entry: /dev/nvidia0 dev/nvidia0 none bind,optional,create=file
      lxc.mount.entry: /dev/nvidia1 dev/nvidia1 none bind,optional,create=file
      lxc.mount.entry: /dev/nvidiactl dev/nvidiactl none bind,optional,create=file
      lxc.mount.entry: /dev/nvidia-modeset dev/nvidia-modeset none bind,optional,create=file
      lxc.mount.entry: /dev/nvidia-uvm dev/nvidia-uvm none bind,optional,create=file
      lxc.mount.entry: /dev/nvidia-uvm-tools dev/nvidia-uvm-tools none bind,optional,create=file
      lxc.mount.entry: /dev/nvidia-caps dev/nvidia-caps none bind,optional,create=dir
      {%- if ct_instance_nvidia_bind_driver_libraries %}
      lxc.mount.entry: /usr/lib/x86_64-linux-gnu/libcuda.so.1 usr/lib/x86_64-linux-gnu/libcuda.so.1 none bind,optional,create=file
      lxc.mount.entry: /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1 usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1 none bind,optional,create=file
      {%- endif %}
      {%- if ct_instance_nvidia_mount_host_cuda_toolkit %}
      lxc.mount.entry: {{ ct_instance_host_cuda_toolkit_path }} {{ ct_instance_host_cuda_toolkit_path | regex_replace('^/', '') }} none bind,optional,create=dir
      {%- endif %}

# Purpose: Warn operators about dpkg cross-device-link risks when binding individual NVIDIA library files.
- name: Warn when CT NVIDIA file-level library binds are enabled
  ansible.builtin.debug:
    msg: >-
      ct_instance_nvidia_bind_driver_libraries=true mounts individual NVIDIA library files into CT.
      If CT also manages NVIDIA/CUDA packages with apt, dpkg cross-device link errors can occur.
      For host-CUDA workflows, prefer ct_instance_nvidia_bind_driver_libraries=false and mount a full toolkit path.
  when:
    - ct_instance_enable_nvidia_passthrough | bool
    - ct_instance_nvidia_bind_driver_libraries | bool

# Purpose: Inform operators that host toolkit mount mode requires aligned CT runtime CUDA settings.
- name: Warn when host CUDA toolkit mount is enabled
  ansible.builtin.debug:
    msg: >-
      ct_instance_nvidia_mount_host_cuda_toolkit=true will bind-mount {{ ct_instance_host_cuda_toolkit_path }} into CT.
      Align ct_runtime_vllm_cuda_home with this path and disable CT-side CUDA package remediation.
  when:
    - ct_instance_enable_nvidia_passthrough | bool
    - ct_instance_nvidia_mount_host_cuda_toolkit | bool

# Purpose: Persist managed NVIDIA passthrough entries into the CT's LXC configuration file.
- name: Configure NVIDIA device passthrough in LXC config
  become: true
  ansible.builtin.blockinfile:
    path: "/etc/pve/lxc/{{ ct_instance_vmid }}.conf"
    marker: "# {mark} ANSIBLE MANAGED NVIDIA PASSTHROUGH"
    block: "{{ ct_instance_nvidia_passthrough_block_effective | default(ct_instance_nvidia_passthrough_block) }}"
    insertafter: EOF
  when:
    - ct_instance_enable_nvidia_passthrough | bool
    - ct_instance_state != 'absent'
  register: ct_instance_nvidia_passthrough_result

# Purpose: Restart container lifecycle (stop) when passthrough configuration changed and restart is enabled.
- name: Stop CT to apply NVIDIA passthrough config changes
  become: true
  ansible.builtin.command: "pct stop {{ ct_instance_vmid }}"
  register: ct_instance_pct_stop
  changed_when: ct_instance_pct_stop.rc == 0
  failed_when:
    - ct_instance_pct_stop.rc != 0
    - "'already stopped' not in ((ct_instance_pct_stop.stderr | default('')) | lower)"
    - "'not running' not in ((ct_instance_pct_stop.stderr | default('')) | lower)"
  when:
    - ct_instance_enable_nvidia_passthrough | bool
    - ct_instance_restart_on_nvidia_passthrough_change | bool
    - ct_instance_nvidia_passthrough_result is defined
    - ct_instance_nvidia_passthrough_result is changed
    - ct_instance_state != 'absent'

# Purpose: Restart container lifecycle (start) after passthrough configuration changes are applied.
- name: Start CT after NVIDIA passthrough config change
  become: true
  ansible.builtin.command: "pct start {{ ct_instance_vmid }}"
  register: ct_instance_pct_start
  changed_when: ct_instance_pct_start.rc == 0
  failed_when:
    - ct_instance_pct_start.rc != 0
    - "'already running' not in ((ct_instance_pct_start.stderr | default('')) | lower)"
  when:
    - ct_instance_enable_nvidia_passthrough | bool
    - ct_instance_restart_on_nvidia_passthrough_change | bool
    - ct_instance_nvidia_passthrough_result is defined
    - ct_instance_nvidia_passthrough_result is changed
    - ct_instance_state != 'absent'
