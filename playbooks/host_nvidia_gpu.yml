---
- name: Prepare PVE host for NVIDIA GPU inference workloads
  hosts: pve_hosts
  become: true
  pre_tasks:
    - name: Remove legacy NVIDIA CUDA source list to avoid signed-by conflicts
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/nvidia-cuda.list
        state: absent
  roles:
    - role: ktooi.pve_inference.host_gpu_common
    - role: ktooi.pve_inference.host_nvidia_gpu
